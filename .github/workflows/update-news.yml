name: Nachrichten aktualisieren

on:
  schedule:
    - cron: '*/10 * * * *'   # alle 10 Minuten
  workflow_dispatch:          # manuell aus der Actions-Oberfläche startbar
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: news-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          # Das Projekt hat keine Abhaengigkeiten und kein Lockfile. Seit v5
          # schaltet setup-node das Zwischenspeichern von selbst ein, sobald es
          # einen Paketmanager erkennt - und bricht dann ab, weil die Sperrdatei
          # fehlt. Hier ausdruecklich abgeschaltet, damit das so bleibt.
          package-manager-cache: false

      - name: Engine testen
        run: node --test src/*.test.mjs

      - name: Nachrichten holen und bewerten
        run: node scripts/fetch.mjs
        env:
          # 'policy' = Zinskanal (starke Daten sind schlecht für Krypto)
          # 'growth' = Wachstumskanal (starke Daten sind gut für Krypto)
          REGIME: policy
          # Optional, hebt das Übersetzungskontingent an. Beide leer lassen
          # heißt: rund 60 Schlagzeilen pro Tag werden übersetzt.
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
          TRANSLATE_EMAIL: ${{ secrets.TRANSLATE_EMAIL }}

      # Sicherheitsnetz: Cloudflares Cron faellt gelegentlich aus und wird nicht
      # wiederholt. Dieser Aufruf stoesst den Worker an, laesst ihn seinen
      # Bestand auffrischen und dabei faellige Benachrichtigungen verschicken.
      - name: Worker anstossen
        if: vars.WORKER_URL != ''
        continue-on-error: true
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          ZUGANG: ${{ secrets.ZUGANG }}
        run: |
          # Schraegstrich am Ende abschneiden: sonst entstuende //tick, und
          # darauf antwortet der Worker mit der Meldungsliste statt zu ticken.
          basis="${WORKER_URL%/}"
          echo "Rufe Worker auf: $basis/tick"
          antwort=$(curl -sS -m 90 -H "x-zugang: $ZUGANG" "$basis/tick")
          echo "$antwort" | head -c 300
          echo
          # Auf den Inhalt pruefen, nicht auf den Statuscode: Beide falschen
          # Adressformen liefern ebenfalls 200, nur eben das Falsche.
          case "$antwort" in
            *'"ok":true'*)
              echo "Tick bestaetigt." ;;
            *'Zugangswort'*)
              echo "::error::Zugangswort fehlt oder stimmt nicht - Secret ZUGANG pruefen." ;;
            *)
              echo "::error::Unerwartete Antwort. Steht in der Variablen WORKER_URL nur die nackte Adresse, ohne Schraegstrich und ohne ?zugang=?" ;;
          esac

      - name: Änderungen committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/news.json docs/data/translations.json docs/data/woche.json
          if git diff --staged --quiet; then
            echo "Keine neuen Meldungen."
          else
            git commit -m "Nachrichten aktualisiert: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
