name: Nachrichten aktualisieren

on:
  schedule:
    - cron: '*/10 * * * *'   # alle 10 Minuten
  workflow_dispatch:          # manuell aus der Actions-Oberfläche startbar
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: news-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Engine testen
        run: node --test src/sentiment.test.mjs

      - name: Nachrichten holen und bewerten
        run: node scripts/fetch.mjs
        env:
          # 'policy' = Zinskanal (starke Daten sind schlecht für Krypto)
          # 'growth' = Wachstumskanal (starke Daten sind gut für Krypto)
          REGIME: policy
          # Optional, hebt das Übersetzungskontingent an. Beide leer lassen
          # heißt: rund 60 Schlagzeilen pro Tag werden übersetzt.
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
          TRANSLATE_EMAIL: ${{ secrets.TRANSLATE_EMAIL }}

      # Sicherheitsnetz: Cloudflares Cron faellt gelegentlich aus und wird nicht
      # wiederholt. Dieser Aufruf stoesst den Worker an, laesst ihn seinen
      # Bestand auffrischen und dabei faellige Benachrichtigungen verschicken.
      - name: Worker anstossen
        if: vars.WORKER_URL != ''
        continue-on-error: true
        run: |
          echo "Rufe Worker auf: ${{ vars.WORKER_URL }}"
          curl -sS -m 90 -w 'HTTP %{http_code} in %{time_total}s' "${{ vars.WORKER_URL }}/tick"
          echo

      - name: Änderungen committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/news.json
          if git diff --staged --quiet; then
            echo "Keine neuen Meldungen."
          else
            git commit -m "Nachrichten aktualisiert: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
