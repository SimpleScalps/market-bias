name = "market-bias"
main = "index.mjs"
compatibility_date = "2026-01-01"

# Hält den Cache im Minutentakt warm, damit Anfragen sofort beantwortet werden.
[triggers]
crons = ["* * * * *"]

[vars]
# 'policy' = Zinskanal (starke Daten sind schlecht für Krypto)
# 'growth' = Wachstumskanal (starke Daten sind gut für Krypto)
REGIME = "policy"

# Optional, aber empfohlen: dauerhafte Ablage für Benachrichtigungs-Abos.
# Anlegen mit:  wrangler kv namespace create STORE
# Danach die ausgegebene id hier eintragen und die beiden Zeilen einkommentieren.
# [[kv_namespaces]]
# binding = "STORE"
# id = "HIER_DIE_ID"
