<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market Bias</title>
<meta name="description" content="US-Wirtschaftsdaten und Weltlage mit automatischer Bullish/Bearish-Einordnung">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Market Bias">
<meta name="theme-color" content="#07090d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="status">
    <span class="brand"><i class="mark"></i>MARKET<span>BIAS</span><em id="ver"></em></span>
    <span class="live">
      <i id="dot" class="dot"></i><span id="clock">--:--:--</span>
      <button id="gear" class="gear" aria-label="Einstellungen">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/><path fill="currentColor" d="m19.4 13-.1-1 .1-1 1.7-1.3-1.7-3-2 .7a7 7 0 0 0-1.7-1L15.3 4h-3.4l-.4 2.4a7 7 0 0 0-1.7 1l-2-.7-1.7 3L7.8 11l-.1 1 .1 1-1.7 1.3 1.7 3 2-.7c.5.4 1.1.8 1.7 1l.4 2.4h3.4l.4-2.4c.6-.2 1.2-.6 1.7-1l2 .7 1.7-3L19.4 13z" opacity=".28"/></svg>
      </button>
    </span>
  </div>

  <div class="seg" role="tablist" aria-label="Anlageklasse">
    <button role="tab" data-asset="crypto" aria-selected="true">KRYPTO</button>
    <button role="tab" data-asset="stocks" aria-selected="false">AKTIEN</button>
    <button role="tab" data-asset="gold"   aria-selected="false">GOLD</button>
    <button role="tab" data-asset="usd"    aria-selected="false">USD</button>
  </div>

  <div class="search">
    <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zm5 12 4 4"/></svg>
    <input id="q" type="search" placeholder="Suchen: nfp, iran, cpi …" autocomplete="off" spellcheck="false">
    <button id="clear" class="clear" aria-label="Suche leeren" hidden>&times;</button>
  </div>

  <nav class="cats" id="cats" aria-label="Kategorie"></nav>

  <div class="sel">
    <label><span id="lblSignal">SIGNAL</span>
      <select id="sent"></select>
    </label>
    <label><span id="lblSort">SORT</span>
      <select id="sort"></select>
    </label>
    <span class="count" id="count">—</span>
  </div>
</header>

<section class="tages" id="tages" aria-live="polite"></section>
<button id="banner" class="banner" hidden></button>
<main id="feed" class="feed" aria-live="polite"></main>
<footer class="foot" id="foot"></footer>

<template id="row">
  <article class="item">
    <button class="head" aria-expanded="false">
      <div class="lead">
        <time></time>
        <span class="cat"></span>
      </div>
      <p class="title"></p>
      <div class="sig">
        <span class="meter"><i></i></span>
        <span class="badge"></span>
      </div>
      <div class="trade">
        <span class="impact"></span>
        <span class="dauer"></span>
        <span class="etyp"></span>
      </div>
      <p class="src"></p>
    </button>
    <div class="why" hidden>
      <p class="uebersetzung" hidden></p>
      <p class="anriss" hidden></p>
      <p class="reason"></p>
      <div class="bars"></div>
      <div class="whyFuss">
        <button class="mehrBtn" aria-expanded="false"></button>
        <button class="kiBtn"></button>
        <button class="frageBtn"></button>
        <a class="link" target="_blank" rel="noopener"></a>
      </div>
      <div class="kiAntwort" hidden></div>
      <div class="frageBox" hidden>
        <div class="frageVerlauf"></div>
        <div class="frageZeile">
          <input class="frageFeld" type="text" maxlength="300" autocomplete="off">
          <button class="frageAb"></button>
        </div>
      </div>
      <div class="detail" hidden></div>
    </div>
  </article>
</template>

<!-- Einstellungen -->
<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitel">
    <div class="sheetKopf">
      <h2 id="mTitel">EINSTELLUNGEN</h2>
      <button id="zu" class="clear" aria-label="Schließen">&times;</button>
    </div>
    <div class="sheetInhalt">

      <div class="feld">
        <label id="lSprache">Sprache</label>
        <div class="wahl" id="sprache">
          <button data-lang="de">Deutsch</button>
          <button data-lang="en">English</button>
        </div>
      </div>

      <div class="feld">
        <label id="lDesign">Design</label>
        <div class="wahl" id="theme">
          <button data-theme="dark">Dunkel</button>
          <button data-theme="light">Hell</button>
          <button data-theme="system">System</button>
        </div>
      </div>

      <div class="feld">
        <label id="lProfil">Trading-Profil</label>
        <div class="wahl" id="profilAn">
          <button data-profil="aus">Alle Meldungen</button>
          <button data-profil="an">Nur was zählt</button>
        </div>
        <div id="profilDetails" hidden>
          <div class="unterfeld">
            <span id="lStil">Stil</span>
            <div class="wahl klein" id="stil">
              <button data-stil="scalping">Scalping</button>
              <button data-stil="intraday">Intraday</button>
              <button data-stil="swing">Swing</button>
              <button data-stil="longterm">Langfristig</button>
            </div>
          </div>
          <div class="unterfeld">
            <span id="lZeit">Zeitrahmen</span>
            <div class="wahl klein" id="tf">
              <button data-tf="1m">1m</button>
              <button data-tf="3m">3m</button>
              <button data-tf="5m">5m</button>
              <button data-tf="15m">15m</button>
              <button data-tf="1h">1h</button>
              <button data-tf="4h">4h</button>
            </div>
          </div>
          <div class="unterfeld">
            <span id="lCoins">Coins</span>
            <div class="wahl klein" id="coins">
              <button data-coin="BTC">BTC</button>
              <button data-coin="ETH">ETH</button>
              <button data-coin="SOL">SOL</button>
              <button data-coin="XRP">XRP</button>
              <button data-coin="BNB">BNB</button>
              <button data-coin="DOGE">DOGE</button>
            </div>
          </div>
        </div>
        <p class="hinweis" id="hProfil"></p>
      </div>

      <div class="feld">
        <label id="lBenach">Benachrichtigungen</label>
        <div class="wahl" id="benach">
          <button data-notify="off">Aus</button>
          <button data-notify="strong">Nur starke</button>
          <button data-notify="direction">Mit Richtung</button>
        </div>
        <p class="hinweis" id="hBenach"></p>

        <div id="kanaele" hidden>
          <div class="unterfeld">
            <span id="lKanaele">Kanäle</span>
            <div class="wahl klein" id="kanalWahl">
              <button data-kanal="ntfy">ntfy</button>
              <button data-kanal="browser">Browser</button>
              <button data-kanal="telegram">Telegram</button>
              <button data-kanal="discord">Discord</button>
            </div>
          </div>
          <div id="ntfyFelder" hidden>
            <input id="ntfyTopic" type="text" placeholder="Themenname, z. B. marktbias-delan-8f3k" spellcheck="false" autocomplete="off">
            <input id="ntfyToken" type="text" placeholder="Zugangstoken tk_… (nötig für Versand über den Worker)" spellcheck="false" autocomplete="off">
            <p class="hinweis" id="hNtfy"></p>
          </div>
          <div id="tgFelder" hidden>
            <input id="tgToken" type="text" placeholder="Bot-Token (123456:ABC-...)" spellcheck="false" autocomplete="off">
            <input id="tgChat" type="text" placeholder="Chat-ID (z. B. 987654321)" spellcheck="false" autocomplete="off">
            <p class="hinweis" id="hTelegram"></p>
          </div>
          <div id="dcFelder" hidden>
            <input id="dcHook" type="url" placeholder="https://discord.com/api/webhooks/..." spellcheck="false" autocomplete="off">
            <p class="hinweis" id="hDiscord"></p>
          </div>
          <button id="testSenden" class="testBtn">Test senden</button>
          <span id="testStatus" class="testStatus"></span>
        </div>
      </div>

      <div class="feld">
        <label id="lLive">Live-Quelle</label>
        <input id="liveInput" type="url" placeholder="https://market-bias.name.workers.dev" spellcheck="false" autocomplete="off">
        <input id="zugangInput" type="text" placeholder="Zugangswort" spellcheck="false" autocomplete="off">
        <p class="hinweis" id="hLive"></p>
      </div>

      <div class="feld">
        <label id="lQuellen">Quellen</label>
        <div class="quellen" id="quellen"></div>
        <p class="hinweis" id="hQuellen"></p>
      </div>

      <div class="feld">
        <h3 id="tZustand"></h3>
        <button class="zustandBtn" id="zustandBtn"></button>
        <div class="zustand" id="zustand" hidden></div>
      </div>

    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
